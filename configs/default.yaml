# 主配置示例：默认走 Cline headless，Gauss 关闭，向量化与重排都用本地模型。
# 规则见 docs/CodingWiki-项目开发计划.md 3.8 节与 20.7 节。
config_version: "1.0"
id: default

model:
  backend: cline
  cline:
    command: ["cline"]
    args: ["--headless", "--workspace", "{workspace}", "--task-file", "{task_file}"]
    timeout_s: 1800
    model_name: ""
    telemetry: false
  gauss:
    enabled: false
    base_url: ""
    api_key_env: CODINGWIKI_GAUSS_KEY
    model: ""
    max_requests_per_minute: 30
    max_concurrent: 1
    daily_budget: 200
  api:
    enabled: false
    base_url: ""              # OpenAI 兼容端点；私有端点只写进 configs/*.local.yaml
    api_key_env: CODINGWIKI_API_KEY
    api_key_file: ""          # 可选：本机密钥文件路径；仓库配置留空
    model: ""
    timeout_s: 300            # 单次请求超时（秒）
    max_retries: 3            # 429/5xx/网络错误的重试次数
    temperature: 0.2          # 文档生成要稳定，不要发散
    max_tokens: 16384         # 必须 ≥16384：8192 会截断页面 JSON

embedding:
  backend: local          # local=真实模型；hash=词面占位（离线/CI）
  model_path: ""          # 空则由 CODINGWIKI_MODEL_DIR 或 ~/models/BAAI 自动解析
  device: auto            # auto / cpu / mps / cuda
  batch_size: 32
  max_length: 512
  dimension: 1024

reranker:
  enabled: true
  model_path: ""          # 同上；默认解析 bge-reranker-v2-m3
  device: auto
  batch_size: 16
  top_n: 8

retrieval:
  top_k: 20
  keyword_weight: 0.5
  vector_weight: 0.5
  min_vector_score: 0.35  # 真实语义模型的拒答门槛；哈希后端用规模自适应公式
  rerank_pool: 20
