# 金标准集 cuphy-v2（S9-b 扩容：50+ 题拒答阈值重标定）
#
# 规则（10.9.1.5）：本文件版本化、只增不改；改题必须升版本号另立文件。
# 与 cuphy-v1 的关系：v1 的 20 问（Q01–Q16 / R01–R04）在本集中**逐字保留**，
# 新增 Q17–Q40（24 检索）与 R05–R16（12 拒答），共 56 问。
# 出题依据：cuphy 快照 4f65f97c 的事实层（模块 106 / 文件 1019 / 构建目标 130 /
# 测试 733 / 配置事实 396）与已发布 91 页 Wiki（S6.5 交付）。
#
# 字段：
#   question       检索/问答原文（模拟真实工程师问法）
#   expect_refused 资料不足应拒答的题（此时不填 expect_any）
#   expect_any     期望资料：page_id 精确匹配，或文件路径（以 / 结尾按前缀匹配）；命中任一即算正确资料
#   difficulty     easy / medium / hard

set_id: cuphy-v2
repo_id: cuphy
description: cuphy 检索与问答扩容集：v1 全部 20 问 + 新增 24 检索题 + 12 拒答题，共 56 问
questions:
  # ================================================================ 检索题（40）
  # ---- 以下 Q01–Q16 为 cuphy-v1 原题，逐字保留（只增不改） ----
  - id: Q01
    question: "LDPC 译码在哪个模块实现？"
    expect_any: ["module/src/cuphy/ldpc", "src/cuphy/ldpc/", "module/util/ldpc"]
    difficulty: easy
  - id: Q02
    question: "PUSCH 信道估计的代码在哪里？"
    expect_any: ["module/src/cuphy/ch_est", "src/cuphy/ch_est/", "examples/ch_est/"]
    difficulty: easy
  - id: Q03
    question: "Polar 编码器的实现文件是什么？"
    expect_any: ["module/src/cuphy/polar_encoder", "src/cuphy/polar_encoder/"]
    difficulty: easy
  - id: Q04
    question: "CRC 校验和附着在哪一部分实现？"
    expect_any: ["module/src/cuphy/crc", "src/cuphy/crc/", "module/test/crc"]
    difficulty: easy
  - id: Q05
    question: "软解调 soft demapper 的实现在哪？"
    expect_any: ["module/src/cuphy/soft_demapper", "src/cuphy/soft_demapper/"]
