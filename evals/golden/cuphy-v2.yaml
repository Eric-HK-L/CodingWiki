    difficulty: medium
  - id: Q09
    question: "PUCCH format 3 的前端处理在哪？"
    expect_any: ["module/src/cuphy/pucch_F3_front_end", "module/examples/pucch_F234_uci_seg"]
    difficulty: hard
  - id: Q10
    question: "解扰 descrambling 的代码位置？"
    expect_any: ["module/src/cuphy/descrambling", "src/cuphy/descrambling/"]
